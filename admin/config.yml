backend:
  name: git-gateway
  branch: cms-staging

media_folder: "images"
public_folder: "/images"

locale: "sv"

collections:
  - name: "site_settings"
    label: "Kontakt & öppettider"
    files:
      - file: "data/site-settings.json"
        label: "Kontakt och öppettider"
        name: "site_settings"
        format: "json"
        editor:
          preview: false
        fields:
          - label: "Kontakt"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Adress", name: "address", widget: "string" }
              - { label: "Telefon (visning)", name: "phone", widget: "string" }
              - { label: "Telefonlänk (tel:)", name: "phoneLink", widget: "string" }
              - { label: "Kartlänk", name: "mapLink", widget: "string" }
          - label: "Öppettider i sidfot"
            name: "openingHoursSummary"
            widget: "list"
            field: { label: "Rad", name: "line", widget: "string" }
          - label: "Detaljerade öppettider (Kontaktsidan)"
            name: "openingHoursDetailed"
            widget: "list"
            fields:
              - { label: "Dag", name: "day", widget: "string" }
              - { label: "Tid", name: "hours", widget: "string" }

  - name: "menu"
    label: "Meny"
    files:
      - file: "data/menu.json"
        label: "Menyinnehåll (sidan Meny)"
        name: "menu"
        format: "json"
        editor:
          preview: false
        fields:
          - label: "Menysektioner"
            name: "sections"
            widget: "list"
            label_singular: "sektion"
            summary: "{{fields.title}}"
            hint: "Varje sektion är en rubrik på menyn (t.ex. Smörrebröd, Dryck). Klicka på en sektion för att redigera, dra för att ändra ordning, och använd 'Lägg till sektion' för en ny."
            fields:
              - label: "Utseende på sektionen"
                name: "layout"
                widget: "select"
                default: "single_column"
                hint: "Välj 'En kolumn' för en vanlig lista, eller 'Två kolumner' för att dela upp samma rader i två kolumner bredvid varandra. Raderna redigeras alltid på samma ställe."
                options:
                  - { label: "Två kolumner", value: "two_columns" }
                  - { label: "En kolumn", value: "single_column" }
              - { label: "Sektionens rubrik", name: "title", widget: "string", hint: "T.ex. Smörrebröd eller Dryck." }
              - label: "Maträtter / produkter"
                name: "items"
                widget: "list"
                required: false
                label_singular: "rad"
                summary: "{{fields.name}} – {{fields.price}}"
                hint: "Alla rader i sektionen redigeras här, oavsett om sektionen visas i en eller två kolumner."
                fields:
                  - { label: "Namn", name: "name", widget: "string", hint: "Namnet på rätten eller produkten." }
                  - { label: "Beskrivning (valfri)", name: "description", widget: "string", required: false, hint: "Kort beskrivning, t.ex. ingredienser." }
                  - { label: "Pris", name: "price", widget: "string", required: false, hint: "T.ex. 69 kr" }
                  - label: "Kolumn (valfritt, endast vid Två kolumner)"
                    name: "column"
                    widget: "select"
                    required: false
                    hint: "Lämna tom för automatisk fördelning på två kolumner."
                    options:
                      - { label: "Vänster kolumn", value: "one" }
                      - { label: "Höger kolumn", value: "two" }
          - label: "Dagens erbjudande"
            name: "offer"
            widget: "object"
            hint: "Rutan med lunch-deal som visas längst ned på menyn."
            fields:
              - { label: "Rubrik", name: "title", widget: "string" }
              - { label: "Pris", name: "price", widget: "string", hint: "T.ex. 69 kr" }
              - { label: "Text", name: "description", widget: "text" }

  - name: "events"
    label: "Aktuellt"
    files:
      - file: "data/events.json"
        label: "Evenemang"
        name: "events"
        format: "json"
        editor:
          preview: false
        fields:
          - label: "Evenemang"
            name: "events"
            widget: "list"
            fields:
              - { label: "Dag", name: "day", widget: "string" }
              - { label: "Månad", name: "month", widget: "string" }
              - { label: "Tagg", name: "tag", widget: "string" }
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Beskrivning", name: "description", widget: "text" }
